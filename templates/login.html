<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Changes</title>
    <link rel="stylesheet" href="../static/css/style.css">
    <link rel="icon" href="../static/img/eko.webp">
    <script>
      // Ustawaj dark mode PRZED wyrenderowaniem aby uniknąć mrugnięcia
      (function() {
        const darkMode = localStorage.getItem('dark-mode');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (darkMode === 'enabled' || (darkMode === null && systemPrefersDark)) {
          document.documentElement.classList.add('dark-mode-init');
        }
      })();
    </script>
    <script src="../static/js/dark-mode.js" defer></script>
</head>

<body>
    <header class="header">
        <img src="../static/img/eko.webp" alt="logo" width="30" height="30">
        <ul class="main-list">
            <li class="list__item">
                <button id="theme-toggle" class="theme-toggle" type="button" onclick="toggleDarkMode();" aria-label="Włącz tryb ciemny" title="Ciemny wygląd">🌙</button>
            </li>
            <li class="list__item">
                <a class="account-button" href="/info">Info</a>
            </li>
            {% if session.get('user_email') %}
            <li class="list__item">
                <a class="account-button" href="/account">{{ session.get('user_name') or 'Konto' }}</a>
            </li>
            {% else %}
            <li class="list__item">
                <a href="/login">
                    <img src="../static/img/login.svg" alt="login" width="20" height="20">
                </a>
            </li>
            {% endif %}
        </ul>
    </header>
    <main class="main-login">
        {% block content %}
        <form action="{{ url_for('login') }}" method="POST" class="login">
            <h1>Zaloguj się</h1>
            {% if message %}
            <p class="account-success">{{ message }}</p>
            {% endif %}
            {% if error %}
            <p class="error">{{ error }}</p>
            {% endif %}

            <label for="email">
                <input class="form__input" type="email" name="email" id="email" placeholder="Email"
                    required>
            </label>

            <label for="password">
                <input class="form__input" type="password" name="password" id="password" placeholder="Hasło"
                    required>
            </label>

            <button type="submit" class="form__button">Zaloguj się</button>
            
            <div class="login-link">
                Nie masz konta? <a href="/register">Zarejestruj się</a>
            </div>
        </form>
        {% endblock %}
    </main>
</body>

</html>
