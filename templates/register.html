<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
  >
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="../static/css/style.css">
<link rel="icon" href="../static/img/eko.webp">         
    <title>Social Changes</title>
    <script>
      // Ustawaj dark mode PRZED wyrenderowaniem aby uniknąć mrugnięcia
      (function() {
        const darkMode = localStorage.getItem('dark-mode');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (darkMode === 'enabled' || (darkMode === null && systemPrefersDark)) {
          document.documentElement.classList.add('dark-mode-init');
        }
      })();
    </script>
    <script src="../static/js/dark-mode.js" defer></script>
</head>
<body>
    <header class="header">
        <img src="../static/img/eko.webp" alt="logo" width="30" height="30">
        <ul class="main-list">
            <li class="list__item">
                <button id="theme-toggle" class="theme-toggle" type="button" onclick="toggleDarkMode();" aria-label="Włącz tryb ciemny" title="Ciemny wygląd">🌙</button>
            </li>
            <li class="list__item">
                <a class="account-button" href="/info">Info</a>
            </li>
            {% if session.get('user_email') %}
            <li class="list__item">
                <a class="account-button" href="/account">{{ session.get('user_name') or 'Konto' }}</a>
            </li>
            {% else %}
            <li class="list__item">
                <a href="/login">
                    <img src="../static/img/login.svg" alt="login" width="20" height="20">
                </a>
            </li>
            {% endif %}
        </ul>
    </header>
    <main class="main-login">
        {% block content %}
        <form action="/register" method="post" class="form">
            <h1>Utwórz konto</h1>
            {% if error %}
            <p class="form__error">{{ error }}</p>
            {% endif %}
            
            <label for="name">
                <input type="text" id="name" name="name" placeholder="Nick" class="form__input" required>
            </label>
            
            <label for="email">
                <input type="email" id="email" name="email" placeholder="Email" class="form__input" required>
            </label>
            
            <label for="password">
                <input type="password" id="password" name="password" placeholder="Hasło" class="form__input" required>
            </label>
            
            <button type="submit" class="form__button">Zarejestruj się</button>
            
            <div class="login-link">
                Masz już konto? <a href="/login">Zaloguj się</a>
            </div>
        </form>
        {% endblock %}
    </main>
    <footer>
    
    </footer>
</body>
</html>
