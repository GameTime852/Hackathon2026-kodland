<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Changes</title>
    <link rel="stylesheet" href="../static/css/style.css">
    <link rel="icon" href="../static/img/eko.webp">
    <script>
      // Ustawaj dark mode PRZED wyrenderowaniem aby uniknąć mrugnięcia
      (function() {
        const darkMode = localStorage.getItem('dark-mode');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (darkMode === 'enabled' || (darkMode === null && systemPrefersDark)) {
          document.documentElement.classList.add('dark-mode-init');
        }
      })();
    </script>
    <script src="../static/js/dark-mode.js" defer></script>
</head>
<body>
    <header class="header">
        <img src="../static/img/eko.webp" alt="logo" width="30" height="30">
        <ul class="main-list">
            <li class="list__item">
              <button id="theme-toggle" class="theme-toggle" type="button" onclick="toggleDarkMode();" aria-label="Włącz tryb ciemny" title="Ciemny wygląd">🌙</button>
            </li>
            <li class="list__item">
              <a href="">
                <img src="../static/img/login.svg" alt="login" width="20" height="20">
              </a>
        </ul>
      </header>
      <main>
        {% block content %}
        {% if draft_saved %}
        <p class="empty-state">Kopia robocza została zapisana.</p>
        {% endif %}
        <form action="{{ url_for('form_create') }}" method="post" class="creat-form">
            <input type="hidden" name="card_id" value="{{ draft.id if editing and draft else '' }}">
            <input type="hidden" name="draft_id" value="{{ draft.id if draft else '' }}">
            <div class="form__card">
                <img class="card__img" src="../static/img/post_icon.png" width="250" height="250" alt="post_icon">
                <div class="form__inputs">
                    <label for="title">
                        <input class="form__input" type="text" name="title" id="title" placeholder="Wpisz tytuł wpisu" value="{{ draft.title if draft else '' }}" required>
                    </label>
                    <label for="subtitle">
                        <input class="form__input" type="text" name="subtitle" id="subtitle" placeholder="Wpisz tytuł dodatkowy" value="{{ draft.subtitle if draft else '' }}" required>
                    </label>
                    <label for="action_type">
                        <select class="form__input" name="action_type" id="action_type" required>
                            {% for action_type in action_types %}
                            <option value="{{ action_type }}" {% if draft and draft.action_type == action_type %}selected{% endif %}>{{ action_type }}</option>
                            {% endfor %}
                        </select>
                    </label>
                    <label for="city">
                        <input class="form__input" type="text" name="city" id="city" placeholder="Miasto" value="{{ draft.city if draft else '' }}" required>
                    </label>
                </div>
                <label for="text">
                    <textarea class="form__text" name="text" id="text" cols="30" rows="10" required placeholder="Wpisz jakiś tekst...">{{ draft.text if draft else '' }}</textarea>
                </label>
                <button class="form__button" type="submit" name="submit_action" value="publish">{% if editing %}Zapisz zmiany{% else %}Stwórz{% endif %}</button>
                {% if not editing %}<button class="form__button" type="submit" name="submit_action" value="save_draft" formnovalidate>Zapisz kopię roboczą</button>{% endif %}
                <button class="form__button" type="submit" name="submit_action" value="cancel" formnovalidate>Opuść tworzenie</button>
            </div>
        </form>
        {% endblock %}
      </main>
</body>
</html>
